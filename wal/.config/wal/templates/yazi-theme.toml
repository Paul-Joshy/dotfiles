# Pywal colors for yazi
[manager]
cwd = { fg = "{color4}" }

hovered         = { fg = "{background}", bg = "{color4}" }
preview_hovered = { underline = true }

find_keyword  = { fg = "{color3}", italic = true }
find_position = { fg = "{color5}", bg = "reset", italic = true }

marker_copied   = { fg = "{color2}", bg = "{color2}" }
marker_cut      = { fg = "{color1}", bg = "{color1}" }
marker_marked   = { fg = "{color6}", bg = "{color6}" }
marker_selected = { fg = "{color3}", bg = "{color3}" }

tab_active   = { fg = "{background}", bg = "{color4}" }
tab_inactive = { fg = "{foreground}", bg = "{color8}" }
tab_width    = 1

count_copied   = { fg = "{background}", bg = "{color2}" }
count_cut      = { fg = "{background}", bg = "{color1}" }
count_selected = { fg = "{background}", bg = "{color3}" }

border_symbol = "│"
border_style  = { fg = "{color8}" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "{color8}", bg = "{color8}" }

mode_normal = { fg = "{background}", bg = "{color4}", bold = true }
mode_select = { fg = "{background}", bg = "{color2}", bold = true }
mode_unset  = { fg = "{background}", bg = "{color1}", bold = true }

progress_label  = { fg = "{foreground}", bold = true }
progress_normal = { fg = "{color4}", bg = "{color8}" }
progress_error  = { fg = "{color1}", bg = "{color8}" }

permissions_t = { fg = "{color4}" }
permissions_r = { fg = "{color3}" }
permissions_w = { fg = "{color1}" }
permissions_x = { fg = "{color2}" }
permissions_s = { fg = "{color5}" }

[input]
border   = { fg = "{color4}" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "{color4}" }
active   = { fg = "{color5}" }
inactive = {}

[tasks]
border  = { fg = "{color4}" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "{color8}" }
cand            = { fg = "{color6}" }
rest            = { fg = "{foreground}" }
desc            = { fg = "{color5}" }
separator       = "  "
separator_style = { fg = "{color8}" }

[help]
on      = { fg = "{color2}" }
exec    = { fg = "{color6}" }
desc    = { fg = "{color5}" }
hovered = { bg = "{color8}", bold = true }
footer  = { fg = "{background}", bg = "{foreground}" }

[filetype]
rules = [
	{ mime = "image/*", fg = "{color6}" },
	{ mime = "video/*", fg = "{color3}" },
	{ mime = "audio/*", fg = "{color3}" },
	{ mime = "application/zip",             fg = "{color5}" },
	{ mime = "application/gzip",            fg = "{color5}" },
	{ mime = "application/x-tar",           fg = "{color5}" },
	{ mime = "application/x-bzip",          fg = "{color5}" },
	{ mime = "application/x-bzip2",         fg = "{color5}" },
	{ mime = "application/x-7z-compressed", fg = "{color5}" },
	{ mime = "application/x-rar",           fg = "{color5}" },
	{ mime = "application/x-xz",            fg = "{color5}" },
	{ mime = "application/doc",        fg = "{color2}" },
	{ mime = "application/pdf",        fg = "{color2}" },
	{ mime = "application/rtf",        fg = "{color2}" },
	{ mime = "application/vnd.*",      fg = "{color2}" },
	{ name = "*", fg = "{foreground}" },
	{ name = "*/", fg = "{color4}" }
]
