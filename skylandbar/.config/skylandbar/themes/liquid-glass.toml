# Read values generated by ~/.config/wal/templates/skylandbar.env.
vars_file = "~/.cache/wal/skylandbar.env"

[vars]
font = "Hack Nerd Font"
radius_large = 16
radius_row = 12
radius_small = 8
spring = 18
glass_tint = "${WAL_BACKGROUND@0.92}"
accent_soft = "${accent@0.34}"

[vars.dark]
primary = "${WAL_FOREGROUND:-0xffffffff}"
secondary = "${WAL_COLOR7:-0xffdce8f7}"
tertiary = "${WAL_COLOR8:-0xffb7c6d9}"
hover = "${accent@0.18}"
accent = "${WAL_ACCENT:-0xffc14461}"
green = "${WAL_COLOR2:-0xff30d158}"
orange = "${WAL_COLOR3:-0xffffb454}"
red = "${WAL_COLOR1:-0xffff5c57}"
purple = "${WAL_COLOR5:-0xffbf5af2}"
shadow = "0x66000000"

[vars.light]
primary = "${WAL_FOREGROUND:-0xff101820}"
secondary = "${WAL_COLOR8:-0xff263849}"
tertiary = "${WAL_COLOR7:-0xff43586b}"
hover = "${accent@0.14}"
accent = "${WAL_ACCENT:-0xffc14461}"
green = "${WAL_COLOR2:-0xff147a3d}"
orange = "${WAL_COLOR3:-0xff9a4d00}"
red = "${WAL_COLOR1:-0xffbd1e24}"
purple = "${WAL_COLOR5:-0xff783c9e}"
shadow = "0x33000000"

[bar]
color = "0x00000000"
glass = "off"
blur_radius = 0
height = 42
margin = 8
y_offset = 4
padding_left = 8
padding_right = 8
corner_radius = 20
glass_spacing = 8
glass_engine = "auto"
glass_refraction = 6
glass_blur = 3
glass_saturation = 1.6
glass_lens_response = 0.35
glass_lens_bounce = 0.3
glass_lens_stretch = 1
motion = "auto"
font_smoothing = false

[defaults]
icon = { font = "${font}:Regular:16", color = "${primary}", padding_left = 10, padding_right = 5 }
label = { font = "SF Pro:Semibold:13", color = "${primary}", padding_right = 10 }
background = { height = 30, corner_radius = "concentric", drawing = false }
popup = { y_offset = 8, height = 32, align = "center", background = { glass = "regular", corner_radius = "${radius_large}", drawing = true } }
